# Project-wide Gradle settings for the Smart Alarm Android application.

# JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Use the AndroidX package structure (required; all new dependencies target AndroidX).
android.useAndroidX=true

# Generate a non-transitive R class per module (faster incremental builds, avoids field
# collisions once the ui/ package is split into alarms/zones/timezone feature modules).
android.nonTransitiveRClass=true

# Kotlin compiler style.
kotlin.code.style=official

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 9.0+ ships built-in Kotlin support and no longer allows applying the separate
# org.jetbrains.kotlin.android plugin alongside it (it errors with "Cannot add extension with
# name 'kotlin'..."). This project keeps the classic separate-plugin setup (kotlin-android,
# kotlin-compose, kotlin-kapt in app/build.gradle.kts) rather than migrating to built-in Kotlin in
# the same step as the AGP 9.3.2 upgrade, to isolate this from the Kotlin/KSP/kapt compatibility
# issues already worked through in Phase 1. This opt-out is supported through AGP 9.x and is
# scheduled for removal in AGP 10.0, at which point built-in Kotlin becomes mandatory.
android.builtInKotlin=false

# AGP 9.0+ also switched its DSL extension object to new, fully-hidden implementation types
# (e.g. ApplicationExtensionImpl$AgpDecorated_Decorated) and removed the old
# com.android.build.gradle.BaseExtension/AppExtension/LibraryExtension types entirely. The
# org.jetbrains.kotlin.android plugin's older versions (including 2.4.10, used here) still cast
# the Android extension to BaseExtension internally to wire up Kotlin source sets, which fails
# with:
#   class ...ApplicationExtensionImpl$AgpDecorated_Decorated cannot be cast to class
#   com.android.build.gradle.BaseExtension
# confirmed as a known AGP 9.0 compatibility break (see the AGP 9.0.0 release notes' "Gradle
# properties" table: android.newDsl default changed false -> true in 9.0, with an explicit
# opt-out for exactly this class of incompatible third-party/build-logic plugin). Setting it back
# to false restores the legacy DSL implementation (still BaseExtension-castable) alongside the
# new interfaces, unblocking kotlin-android the same way android.builtInKotlin=false unblocks it
# for the "built-in Kotlin" conflict above. Also scheduled for removal in AGP 10.0.
android.newDsl=false
