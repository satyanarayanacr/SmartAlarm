# Project-wide Gradle settings for the Smart Alarm Android application.

# JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Use the AndroidX package structure (required; all new dependencies target AndroidX).
android.useAndroidX=true

# Generate a non-transitive R class per module (faster incremental builds, avoids field
# collisions once the ui/ package is split into alarms/zones/timezone feature modules).
android.nonTransitiveRClass=true

# Kotlin compiler style.
kotlin.code.style=official

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
